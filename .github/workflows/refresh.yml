name: Daily Dashboard Refresh

on:
  schedule:
    - cron: '0 10 * * *'   # 6AM EDT (UTC-4), Apr-Nov
    - cron: '0 11 * * *'   # 6AM EST (UTC-5), Nov-Apr
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest sheet data and rebuild dashboard
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python refresh_data.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
